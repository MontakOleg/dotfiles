[dotfiles]
"~/.vim" = { source = "vim", mode = "symlink" }
"~/.vimrc" = { source = "vim/rc", mode = "symlink" }
"~/.config/nvim" = { source = "nvim", mode = "symlink" }
"~/.zshrc" = { source = "zsh/rc", mode = "symlink" }
"~/.zprofile" = { source = "zsh/profile", mode = "symlink" }
"~/.zshenv" = { source = "zsh/zshenv", mode = "symlink" }
"~/.tigrc" = { source = "tig/rc", mode = "symlink" }
"~/.gemrc" = { source = "ruby/gemrc", mode = "symlink" }
"~/.config/ghostty" = { source = "ghostty", mode = "symlink" }
"~/.config/fish" = { source = "fish", mode = "symlink" }
"~/Library/Application Support/lazygit/config.yml" = { source = "lazygit/config.yml", mode = "symlink" }
"~/.config/ripgreprc" = { source = "ripgreprc", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.local/bin/mitm_start.sh" = { source = "bin/mitm_start.sh", mode = "symlink" }

[bootstrap.macos.dock]
orientation = "left"
autohide = true
show_recents = false

[bootstrap.macos.trackpad]
tap_to_click = true

# Pressing the Fn/globe key alone does nothing
# (System Settings > Keyboard > "Press globe key to").
[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0

# Hot corners: corner 1 = no action, modifier 0 = no modifier key.
[bootstrap.macos.defaults."com.apple.dock"]
wvous-tl-corner = 1
wvous-tr-corner = 1
wvous-bl-corner = 1
wvous-br-corner = 1
wvous-tl-modifier = 0
wvous-tr-modifier = 0
wvous-bl-modifier = 0
wvous-br-modifier = 0

# Loads the SSH keys stored in the keychain into ssh-agent at login.
[bootstrap.macos.launchd.agents.ssh-add-keychain]
program = "/usr/bin/ssh-add"
args = ["--apple-load-keychain"]
environment = { APPLE_SSH_ADD_BEHAVIOR = "macos" }
run_at_load = true
stdout_path = "/dev/null"
stderr_path = "/dev/null"

[bootstrap.hooks]
post-defaults = "killall Dock || true"

# Runs at the end of `mise bootstrap`; vim-plug only installs missing plugins.
[tasks.bootstrap]
run = "nvim --headless +PlugInstall +qa"
